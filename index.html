<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS CONNECT</title>
    <style>
        body {
            background: #050508;
            color: #00f3ff;
            font-family: 'Segoe UI', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            border: 1px solid #00f3ff;
            padding: 40px;
            border-radius: 10px;
            background: #111;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }
        h1 { margin-bottom: 5px; letter-spacing: 2px; }
        p { color: #888; margin-bottom: 20px; font-size: 0.9em; }
        input {
            background: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            font-size: 1.5em;
            text-align: center;
            width: 200px;
            letter-spacing: 5px;
            text-transform: uppercase;
            border-radius: 5px;
            margin-bottom: 20px;
            display: block;
            margin: 0 auto 20px auto;
        }
        input:focus { outline: none; border-color: #00f3ff; }
        button {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover { background: #fff; box-shadow: 0 0 15px #00f3ff; }
        #msg { margin-top: 20px; font-size: 0.9em; color: #ff0055; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEXUS PORTAL</h1>
        <p>ENTER DEVICE CODE TO ACCESS STORAGE</p>
        
        <input type="text" id="code" maxlength="10" placeholder="XXXXXXXXXX">
        <button onclick="connect()">CONNECT</button>
        
        <div id="msg"></div>
    </div>

    <script>
        // --- KONFIGURASI ---
        // URL Database Anda (tambahkan /devices/ di akhir nanti)
        const DB_URL = "https://tracker-e5b14-default-rtdb.firebaseio.com/devices";

        // Cek URL kalau ada kode otomatis (contoh: .../?code=ABC123)
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get('code');
            if(codeParam) {
                document.getElementById('code').value = codeParam;
                connect();
            }
        };

        async function connect() {
            const code = document.getElementById('code').value.trim().toUpperCase();
            const msg = document.getElementById('msg');
            
            if(code.length !== 10) {
                msg.innerText = "Invalid Code Length";
                return;
            }

            msg.innerText = "Searching Satellite...";
            msg.style.color = "#00f3ff";

            try {
                // Ambil data IP dari Firebase
                // Kita pakai REST API biasa agar tidak perlu config library yang berat
                const response = await fetch(`${DB_URL}/${code}.json`);
                const data = await response.json();

                if(data && data.ip) {
                    msg.innerText = "Target Found! Redirecting to: " + data.ip;
                    
                    // JEDA SEBENTAR (Opsional, biar kelihatan keren)
                    setTimeout(() => {
                        // --- INI KUNCI RAHASIANYA ---
                        // Alihkan browser user ke IP Address lokal ESP32
                        window.location.href = `http://${data.ip}`; 
                    }, 1000);
                    
                } else {
                    msg.style.color = "#ff0055";
                    msg.innerText = "Device Not Found or Offline";
                }

            } catch (error) {
                console.error(error);
                msg.style.color = "#ff0055";
                msg.innerText = "Connection Error";
            }
        }
    </script>
</body>
</html>
